<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WHB04B-6 Pendant (CNCjs widget)</title>
<!-- Same-origin socket.io client served by CNCjs; guarantees a version match. -->
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { color-scheme: light; font: 13px/1.4 Arial, "Helvetica Neue", Helvetica, sans-serif; color: #333; background: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 5px; }
  .connection-bar { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-bottom: 4px; }
  .pill { min-width: 0; max-width: 100%; padding: 0 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; overflow-wrap: anywhere; }
  .pill.ok { color: #3c763d; background: #dff0d8; border-color: #d6e9c6; }
  .pill.bad { color: #a94442; background: #f2dede; border-color: #ebccd1; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 5px 0; }
  button, input, select, textarea { font: inherit; }
  button { min-height: 28px; padding: 3px 8px; color: #333; background: #fff; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; }
  button:hover { background: #e6e6e6; border-color: #adadad; }
  button:disabled { opacity: .65; cursor: default; }
  :is(button, input, select, textarea, summary):focus-visible { outline: 2px solid #337ab7; outline-offset: 2px; }
  .readout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 5px 0; padding: 3px 0; background: #f6f7f8; border: 1px solid #ccc; }
  .readout > div { min-width: 0; padding: 0 6px; border-right: 1px solid #ddd; }
  .readout > div:last-child { border-right: 0; }
  .readout dt { color: #666; font-size: 11px; font-weight: normal; }
  .readout dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  #operationStatus { margin: 4px 0; color: #555; font-size: 11px; overflow-wrap: anywhere; }
  .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; border-top: 1px solid #ddd; }
  .panels > details[open] { grid-column: 1 / -1; }
  details { min-width: 0; }
  summary { min-height: 28px; padding: 5px 0; cursor: pointer; }
  label.field { display: inline-flex; flex-direction: column; gap: 2px; font-size: 12px; max-width: 100%; }
  input, select, textarea { max-width: 100%; padding: 4px 6px; color: #555; background: #fff; border: 1px solid #ccc; border-radius: 3px; }
  input { width: 8rem; min-height: 28px; }
  select { min-height: 28px; }
  .settings-help, .settings-status { font-size: 12px; line-height: 1.4; }
  .settings-status { overflow-wrap: anywhere; }
  .settings-status:empty { margin: 0; }
  .settings-status[data-state="error"] { color: #a94442; }
  .settings-status[data-state="warning"] { color: #8a6d3b; }
  #macroSettings > :is(.settings-help, .settings-status) { margin: 4px 0; }
  #macroAssignments { display: grid; gap: 6px; margin: 8px 0; }
  .macro-assignment { min-width: 0; margin: 0; padding: 6px; border: 1px solid #ddd; border-radius: 3px; }
  .macro-assignment legend { padding: 0 4px; font-size: 12px; font-weight: 600; }
  .macro-slot { margin-left: 6px; font-size: 11px; font-weight: 400; color: #666; }
  .macro-choice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center; font-size: 12px; }
  .macro-choice select { min-width: 0; width: 100%; }
  .macro-add { align-items: end; }
  .macro-add .field { flex: 1; min-width: 0; }
  .macro-add select { width: 100%; }
  .macro-assignment > button { margin-top: 6px; }
  .macro-code { display: block; width: 100%; margin-top: 6px; resize: vertical; font-family: monospace; font-size: 12px; }
  .macro-preview { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; padding: 6px; max-height: 12rem; overflow: auto; background: #f5f5f5; font-size: 12px; }
  .macro-note { margin: 6px 0 0; font-size: 12px; overflow-wrap: anywhere; }
  .macro-note[data-state="missing"] { color: #a94442; }
  [hidden] { display: none !important; }
  .raw-keys { margin: 0 0 5px; font-size: 12px; }
  #log { margin: 0; font: 11px/1.4 monospace; white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f5f5; border: 1px solid #ddd; padding: 5px; height: 110px; overflow: auto; }
</style>
</head>
<body>
  <div class="connection-bar" aria-label="Pendant and CNCjs connections">
    <span id="hidPill" class="pill bad">pendant offline</span>
    <span id="sockPill" class="pill bad">socket offline</span>
    <span id="tokenPill" class="pill bad">no token</span>
    <span id="portPill" class="pill bad">no port</span>
  </div>
  <div class="row">
    <button id="connect" type="button">Connect pendant</button>
    <button id="reconnectSock" type="button">Re-read creds &amp; connect</button>
  </div>
  <dl class="readout" aria-label="Pendant operating readout">
    <div><dt>Mode</dt><dd id="mode">step</dd></div>
    <div><dt>Axis</dt><dd id="ld">—</dd></div>
    <div><dt>Rate / step</dt><dd id="rd">—</dd></div>
    <div><dt>Wheel</dt><dd id="jog">0</dd></div>
  </dl>
  <p id="operationStatus" role="status" aria-live="polite"></p>
  <div class="panels">
    <details id="pendantSettings">
      <summary>Pendant settings</summary>
      <div class="row">
        <label class="field">Probe plate mm<input id="thickness" type="number" step="0.01" value="20" /></label>
        <label class="field">Spindle increment (RPM)<input id="spindleIncrement" type="number" min="1" value="100" /></label>
        <label class="field"><span id="largeStepsLabel">5/10 steps (waiting for G20/G21)</span><select id="largeSteps"><option value="disabled">Disabled</option><option value="enabled">Enabled</option></select></label>
      </div>
    </details>
    <details id="macroSettings">
      <summary>Macro buttons</summary>
      <p class="settings-help">Add a button, then choose its macro.</p>
      <div class="row macro-add">
        <label class="field" for="macroButtonToAdd">Unused Fn combination<select id="macroButtonToAdd"></select></label>
        <button id="addMacro" type="button">Add macro button</button>
      </div>
      <p id="macroEmpty" class="settings-help">No assignments yet.</p>
      <div id="macroAssignments"></div>
      <button id="refreshMacros" type="button">Refresh CNCjs macros</button>
      <p id="macroStatus" class="settings-status" role="status" aria-live="polite"></p>
    </details>
    <details>
      <summary>Diagnostics</summary>
      <p class="raw-keys">Raw keys: <span id="k1">—</span> / <span id="k2">—</span></p>
      <pre id="log" aria-label="Pendant diagnostic log" tabindex="0"></pre>
    </details>
  </div>
  <div id="settingsActions" class="row" hidden>
    <button id="saveConfig" type="button">Save settings</button>
  </div>
  <p id="settingsStatus" class="settings-status" role="status" aria-live="polite"></p>
  <script type="module" src="./whb04b-widget.js"></script>
</body>
</html>
