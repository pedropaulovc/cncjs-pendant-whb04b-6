<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WHB04B-6 Pendant (CNCjs widget)</title>
<!-- Same-origin socket.io client served by CNCjs; guarantees a version match. -->
<script src="/socket.io/socket.io.js"></script>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 12px; }
  h1 { font-size: 1rem; margin: 0 0 8px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pill { font-size: .72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid #8884; }
  .pill.ok { background: #1a9e4b22; color: #1a9e4b; border-color: #1a9e4b66; }
  .pill.bad { background: #c0392b22; color: #c0392b; border-color: #c0392b66; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  button { font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid #8884; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 6px 8px; }
  .card .label { font-size: .65rem; opacity: .65; text-transform: uppercase; }
  .card .value { font-size: 1.1rem; font-weight: 600; }
  label.field { display: inline-flex; flex-direction: column; font-size: .7rem; gap: 2px; }
  input { font: inherit; padding: 3px; width: 5rem; }
  #log { font-family: ui-monospace, monospace; font-size: .72rem; white-space: pre; background: #8881; border-radius: 7px; padding: 6px; height: 130px; overflow: auto; }
</style>
</head>
<body>
  <h1>WHB04B-6 Pendant — WebHID</h1>

  <div class="pills">
    <span id="hidPill" class="pill bad">pendant ✗</span>
    <span id="sockPill" class="pill bad">socket ✗</span>
    <span id="tokenPill" class="pill bad">no token</span>
    <span id="portPill" class="pill bad">no port</span>
  </div>

  <div class="row">
    <button id="connect">Connect pendant</button>
    <button id="reconnectSock">Re-read creds &amp; connect</button>
    <label class="field">Probe plate mm<input id="thickness" type="number" step="0.01" value="20" /></label>
  </div>

  <div class="row">Mode: <strong id="mode">mpg</strong></div><div class="grid">
    <div class="card"><div class="label">Key 1</div><div class="value" id="k1">—</div></div>
    <div class="card"><div class="label">Key 2</div><div class="value" id="k2">—</div></div>
    <div class="card"><div class="label">Axis</div><div class="value" id="ld">—</div></div>
    <div class="card"><div class="label">Rate</div><div class="value" id="rd">—</div></div>
    <div class="card"><div class="label">Jog</div><div class="value" id="jog">0</div></div>
  </div>

  <details>
    <summary>Pendant settings</summary>
    <div class="row">
      <label class="field">Step feed (mm/min)<input id="stepFeed" type="number" min="0.001" step="1" value="250" /></label>
      <label class="field">Spindle increment (RPM)<input id="spindleIncrement" type="number" min="1" value="100" /></label>
      <label class="field">5/10 mm steps<select id="largeSteps"><option value="disabled">Disabled</option><option value="enabled">Enabled</option></select></label>
    </div>
    <details><summary>Advanced: G-code macros</summary>
      <p style="font-size:.75rem">JSON slots: 1, 2, 5, 6, 7, 9, 11, 12, 13, 14. Example: {"1":"G0 X0"}. Use \n between lines.</p>
      <textarea id="config" rows="6" style="width:100%;box-sizing:border-box" aria-label="G-code macros JSON"></textarea>
    </details>
    <button id="saveConfig">Save settings</button>
  </details>
  <h2 style="font-size:.8rem;margin:10px 0 4px">Log</h2>
  <div id="log"></div>

  <script type="module" src="./whb04b-widget.js"></script>
</body>
</html>
